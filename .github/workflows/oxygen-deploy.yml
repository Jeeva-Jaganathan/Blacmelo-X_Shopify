name: Deploy to Oxygen (BLACMELO new, storefront 1000185922)
on: [push]

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # main deploys to the storefront's production environment (its myshopify.dev URL, not blacmelo.com);
      # every other branch becomes a preview deployment
      - name: Build and publish to Oxygen
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN }}

      - name: Show deployment URL
        if: success()
        run: |
          url=$(node -e "console.log(require('./h2_deploy_log.json').url ?? '')")
          echo "Deployment URL: $url"
          echo "### Oxygen deployment: $url" >> "$GITHUB_STEP_SUMMARY"
